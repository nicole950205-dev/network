<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>邏輯閘實驗室</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#e9edf2;--card:#f9fafc;--ink:#1b2430;--sub:#566476;--line:#c5ceda;--lo:#8b98a8;--hi:#d98a00;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121821;--card:#1a222d;--ink:#e7ecf3;--sub:#94a3b6;--line:#2c3848;--lo:#5d6b7d;--hi:#ffc233;--on:#121821}}
:root[data-theme="dark"]{--bg:#121821;--card:#1a222d;--ink:#e7ecf3;--sub:#94a3b6;--line:#2c3848;--lo:#5d6b7d;--hi:#ffc233;--on:#121821}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
h1{font:700 clamp(26px,6.5vw,38px)/1.25 "Noto Sans TC",sans-serif;margin:0 0 6px}
.lead{margin:0 0 18px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;font-size:15px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:6px 14px;min-height:42px}
button:hover{background:var(--line)}
button[aria-pressed="true"],button.sel{background:var(--ink);color:var(--card)}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.inputs{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tg{min-width:92px;font-family:"JetBrains Mono",ui-monospace,monospace;border-color:var(--lo);color:var(--sub)}
.tg[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--on)}
svg{display:block;width:100%;height:auto}
.desc{margin:6px 0 0;color:var(--sub);font-size:15px}
table{border-collapse:collapse;width:100%;font-family:"JetBrains Mono",ui-monospace,monospace;text-align:center}
th,td{padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:500}
tr.cur td{background:var(--hi);color:var(--on);font-weight:700}
h2{font-size:17px;margin:0 0 8px}
.big{font:500 34px "JetBrains Mono",ui-monospace,monospace;text-align:center;margin:8px 0}
.leds{display:flex;gap:14px;flex-wrap:wrap}
.led{flex:1 1 140px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.led i{width:28px;height:28px;border-radius:50%;background:var(--lo);flex:none}
.led.on i{background:var(--hi);box-shadow:0 0 14px var(--hi)}
.led small{display:block;color:var(--sub);line-height:1.3}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>邏輯閘實驗室</h1>
<p class="lead">數位電路的基本積木。切換輸入的 0 和 1，看輸出怎麼變，再用半加器看看電腦怎麼做 1+1。</p>

<div class="tabs" role="tablist">
  <button id="t1" aria-pressed="true">邏輯閘</button>
  <button id="t2" aria-pressed="false">半加器</button>
</div>

<section id="p1">
  <div class="chips" id="chips"></div>
  <div class="card">
    <div class="inputs" id="ins"></div>
    <svg id="gsvg" viewBox="0 0 400 160" role="img" aria-label="邏輯閘電路圖"></svg>
    <p class="desc" id="gdesc"></p>
  </div>
  <div class="card"><h2>真值表</h2><table id="tt"></table></div>
</section>

<section id="p2" class="hide">
  <div class="card">
    <p class="desc" style="margin-top:0">半加器把兩個一位元相加：和 S 用 XOR，進位 C 用 AND。</p>
    <div class="inputs" style="margin-top:12px">
      <button class="tg" id="ha" aria-pressed="false">A = 0</button>
      <button class="tg" id="hb" aria-pressed="false">B = 0</button>
    </div>
    <div class="big" id="sum"></div>
    <div class="leds">
      <div class="led" id="ls"><i></i><span><b>S（和）</b><small>A XOR B</small></span></div>
      <div class="led" id="lc"><i></i><span><b>C（進位）</b><small>A AND B</small></span></div>
    </div>
    <p class="desc">只有 1 + 1 時，和歸零並向前進位，結果是二進位的 10，也就是十進位的 2。</p>
  </div>
  <div class="card"><h2>真值表</h2><table id="ht"></table></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const G={
 AND:{f:(a,b)=>a&b,d:"兩個輸入都是 1，輸出才是 1。"},
 OR:{f:(a,b)=>a|b,d:"只要有一個輸入是 1，輸出就是 1。"},
 NOT:{f:a=>a?0:1,d:"把輸入反相：0 變 1，1 變 0。只有一個輸入。",one:1},
 NAND:{f:(a,b)=>(a&b)?0:1,d:"AND 再反相。它能組出所有其他邏輯閘，所以叫通用閘。"},
 NOR:{f:(a,b)=>(a|b)?0:1,d:"OR 再反相。兩個輸入都是 0，輸出才是 1。"},
 XOR:{f:(a,b)=>a^b,d:"兩個輸入不同，輸出才是 1。"},
 XNOR:{f:(a,b)=>(a^b)?0:1,d:"兩個輸入相同，輸出就是 1。"}
};
const shape={
 AND:["M0 0H40A25 30 0 0 1 40 60H0Z",65,0,0],OR:["M0 0Q35 0 65 30Q35 60 0 60Q16 30 0 0Z",65,0,0],
 XOR:["M0 0Q35 0 65 30Q35 60 0 60Q16 30 0 0Z",65,0,1],NOT:["M0 0L55 30L0 60Z",55,1,0]
};
let cur="AND",A=0,B=0;
const base={NAND:"AND",NOR:"OR",XNOR:"XOR"};
function gate(){
  const g=G[cur],one=g.one,b0=base[cur]||cur,[path,w,bub0,ext]=shape[b0],bub=!!base[cur]||b0==="NOT";
  const out=g.f(A,B),col=v=>v?"var(--hi)":"var(--lo)";
  const gx=130,gy=50,end=gx+w+(bub?10:0);
  let s=`<g fill="none" stroke-width="4" stroke-linecap="round">`;
  if(one)s+=`<path d="M20 80H${gx}" stroke="${col(A)}"/>`;
  else s+=`<path d="M20 65H${gx+(ext?6:0)}" stroke="${col(A)}"/><path d="M20 95H${gx+(ext?6:0)}" stroke="${col(B)}"/>`;
  s+=`<path d="M${end} 80H320" stroke="${col(out)}"/></g>`;
  s+=`<g transform="translate(${gx} ${gy})" fill="var(--card)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"><path d="${path}"/>${ext?`<path d="M-9 0Q7 30 -9 60" fill="none"/>`:""}${bub?`<circle cx="${w+5}" cy="30" r="5"/>`:""}</g>`;
  s+=`<circle cx="345" cy="80" r="20" fill="${out?"var(--hi)":"var(--lo)"}" ${out?'style="filter:drop-shadow(0 0 8px var(--hi))"':""}/><text x="345" y="86" text-anchor="middle" font-size="18" font-weight="700" font-family="JetBrains Mono,monospace" fill="${out?"var(--on)":"var(--card)"}">${out}</text>`;
  s+=`<text x="12" y="${one?72:57}" font-size="15" fill="var(--sub)">A</text>`+(one?"":`<text x="12" y="112" font-size="15" fill="var(--sub)">B</text>`);
  $("gsvg").innerHTML=s;
  $("gdesc").textContent=cur+"：" +g.d;
  let t=`<tr><th>A</th>${one?"":"<th>B</th>"}<th>輸出</th></tr>`;
  const rows=one?[[0],[1]]:[[0,0],[0,1],[1,0],[1,1]];
  rows.forEach(r=>{const on=r[0]===A&&(one||r[1]===B);t+=`<tr class="${on?"cur":""}"><td>${r[0]}</td>${one?"":`<td>${r[1]}</td>`}<td>${g.f(r[0],r[1])}</td></tr>`});
  $("tt").innerHTML=t;
  $("ins").innerHTML="";
  [["A",A,v=>A=v]].concat(one?[]:[["B",B,v=>B=v]]).forEach(([n,v,set])=>{
    const b=document.createElement("button");b.className="tg";b.setAttribute("aria-pressed",!!v);b.textContent=n+" = "+v;
    b.onclick=()=>{set(v?0:1);gate()};$("ins").appendChild(b)});
}
Object.keys(G).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>{cur=k;[...$("chips").children].forEach(c=>c.classList.toggle("sel",c===b));gate()};if(k===cur)b.className="sel";$("chips").appendChild(b)});
let ha=0,hb=0;
function half(){
  const S=ha^hb,C=ha&hb;
  [["ha","A",ha],["hb","B",hb]].forEach(([id,n,v])=>{$(id).textContent=n+" = "+v;$(id).setAttribute("aria-pressed",!!v)});
  $("sum").textContent=ha+" + "+hb+" = "+C+""+S;
  $("ls").classList.toggle("on",!!S);$("lc").classList.toggle("on",!!C);
  let t="<tr><th>A</th><th>B</th><th>C</th><th>S</th></tr>";
  [[0,0],[0,1],[1,0],[1,1]].forEach(([a,b])=>t+=`<tr class="${a===ha&&b===hb?"cur":""}"><td>${a}</td><td>${b}</td><td>${a&b}</td><td>${a^b}</td></tr>`);
  $("ht").innerHTML=t;
}
$("ha").onclick=()=>{ha^=1;half()};$("hb").onclick=()=>{hb^=1;half()};
function tab(n){$("p1").classList.toggle("hide",n!==1);$("p2").classList.toggle("hide",n!==2);$("t1").setAttribute("aria-pressed",n===1);$("t2").setAttribute("aria-pressed",n===2)}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
gate();half();
</script>
</body>
</html>
